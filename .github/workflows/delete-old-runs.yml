name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:
    inputs:
      source:
        description: What started this run
        type: string
        default: manual

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{secrets.PERSONAL_ACCESS_TOKEN}}
          retain_days: 2
          keep_minimum_runs: 5
